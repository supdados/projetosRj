<!doctype html>
<html lang="pt-br" data-theme="light" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="file:///Users/juniorguimaraes/Downloads/projetosRj/static/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="file:///Users/juniorguimaraes/Downloads/projetosRj/static/css/design-system.css">
    <link rel="stylesheet" href="file:///Users/juniorguimaraes/Downloads/projetosRj/static/css/projects/detail.css">
</head>
<body class="is-authenticated">
    <div class="container-fluid px-3 py-3">
        <div class="project-header" id="projectMainHeader">
            <div class="d-flex justify-content-between align-items-start mb-2 project-header-main-row">
                <div class="project-header-main-content">
                    <h1 class="mb-2" data-field="titulo" data-value="123 - Titulo do projeto">123 - Titulo do projeto</h1>
                    <p class="mb-2 project-header-description project-header-description-muted"
                       data-field="short_description" data-value="otimooo">otimooo</p>
                </div>
                <a href="#" class="btn btn-sm back-button ms-3 btn-back-to-list">Voltar</a>
            </div>
        </div>
        <div id="projectCompactHeader"></div>
        <button type="button" class="btn-edit-project">Editar</button>
        <button type="button" class="btn-save-project ds-hidden">Salvar</button>
        <button type="button" class="btn-cancel-edit ds-hidden">Cancelar</button>
        <pre id="metrics"></pre>
    </div>
    <script>
        window.ProjectDetailPage = {
            refs: {
                editButton: document.querySelector('.btn-edit-project'),
                saveButton: document.querySelector('.btn-save-project'),
                cancelButton: document.querySelector('.btn-cancel-edit'),
                projectCompactHeader: document.getElementById('projectCompactHeader')
            },
            shared: {
                availableAreas: [],
                canEditAreaResponsavel: true,
                setCompactHeaderVisible: function () {},
                showAjaxFlashMessage: function () {}
            },
            config: { projectId: 1 },
            registerInit: function (name, fn) { fn(this); }
        };
        window.fetch = function () {
            return Promise.resolve({ json: function () { return Promise.resolve({ success: false }); } });
        };
    </script>
    <script src="file:///Users/juniorguimaraes/Downloads/projetosRj/static/js/pages/projects/detail/09-project-inline-editor.js"></script>
    <script>
        function box(el) {
            const rect = el.getBoundingClientRect();
            const styles = getComputedStyle(el);
            return {
                top: Math.round(rect.top * 100) / 100,
                bottom: Math.round(rect.bottom * 100) / 100,
                height: Math.round(rect.height * 100) / 100,
                marginBottom: styles.marginBottom
            };
        }
        const beforeTitle = document.querySelector('[data-field="titulo"]');
        const beforeDescription = document.querySelector('[data-field="short_description"]');
        const before = { title: box(beforeTitle), description: box(beforeDescription) };
        before.gap = Math.round((before.description.top - before.title.bottom) * 100) / 100;
        setTimeout(function () {
            document.querySelector('.btn-edit-project').click();
            setTimeout(function () {
                const title = document.querySelector('textarea[data-field="titulo"]');
                const description = document.querySelector('textarea[data-field="short_description"]');
                const after = { title: box(title), description: box(description) };
                after.gap = Math.round((after.description.top - after.title.bottom) * 100) / 100;
                document.getElementById('metrics').textContent = JSON.stringify({ before, after }, null, 2);
            }, 100);
        }, 100);
    </script>
</body>
</html>
