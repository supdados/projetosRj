name: migracao

# GUARDIÃO DA CADEIA ALEMBIC (auditoria sprint 5.5).
# A cadeia `migrations/versions/*` é a única produtora de DDL desde a sprint 5.3:
# o boot só verifica `alembic_version`, ninguém mais roda `create_all` em produção.
# Este workflow reprova o merge quando (1) `alembic upgrade head` quebra num banco
# vazio (elo faltando/duplicado, migração não idempotente), (2) o autogenerate acha
# diferença entre os modelos e o schema da cadeia (migração esquecida) ou (3) o teste
# de completude de schema falha. Produção roda SQLite hoje e a ida a MySQL será
# instalação limpa (upgrade head em banco vazio) — por isso os dois dialetos partem
# do zero aqui, e não de um dump legado.

on:
  push:
    branches: [main, v5.0]
  pull_request:
    branches: [main, v5.0]

permissions:
  contents: read

env:
  # Sem .env no runner: create_app() exige SECRET_KEY já no import de `app`.
  SECRET_KEY: ci-migracao-secret-nao-usada-em-producao
  PYTHONUNBUFFERED: "1"

jobs:
  sqlite:
    name: SQLite vazio → upgrade head + completude de schema
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements
            requirements-dev.txt
      - name: Instalar dependências (produção + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements -r requirements-dev.txt
      - name: alembic upgrade head num SQLite vazio
        # `flask --app app db ...` (e não o CLI `alembic`): migrations/env.py resolve a
        # engine via current_app. O boot detecta o CLI `flask db` e pula a verificação
        # de schema — do contrário seria impossível migrar um banco ainda vazio.
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci-migracao.sqlite
        run: |
          flask --app app db upgrade
          flask --app app db current
      - name: Teste de completude do schema (cadeia × modelos)
        # Sobe outro SQLite vazio in-process, roda upgrade head e compara com
        # db.metadata (tabelas, colunas e diff do autogenerate).
        run: pytest tests/test_migracao_schema_completude.py -q

  mysql:
    name: MySQL limpo → upgrade head + alembic check
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: projetosrj_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/projetosrj_ci
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements
            requirements-dev.txt
      - name: Instalar dependências (produção + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements -r requirements-dev.txt
      - name: alembic upgrade head no MySQL limpo
        run: |
          flask --app app db upgrade
          flask --app app db current
      - name: alembic check (diff do autogenerate tem de ser vazio)
        # Sai com código 1 e lista as operações quando modelos × cadeia divergem —
        # é o gate que impede merge de model novo sem a migração correspondente.
        run: flask --app app db check
