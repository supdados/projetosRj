name: scorecard

# OpenSSF Scorecard — avalia a postura de segurança do repositório (~18 checks:
# pinned-dependencies, token-permissions, dangerous-workflow, branch-protection, etc.).
# Resultado vai para a aba Security (code scanning) e para o painel público scorecard.dev.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 7 * * 1" # segunda 07:00 UTC
  push:
    branches: [main]

# Mínimo no topo; o job eleva só o necessário.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload do SARIF para code scanning
      id-token: write # publicar resultados no scorecard.dev (repo público)
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
