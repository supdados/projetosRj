<script nonce="{{ csp_nonce }}">
    // Lógica Unificada para o Modal de Adicionar Projeto - Quick Create
    document.addEventListener('DOMContentLoaded', function() {
        const addProjectModal = document.getElementById('addProjectModal');
        const addProjectForm = document.getElementById('addProjectFormModal');
        const submitButton = document.getElementById('createProjectSubmitBtn');
        const titleInput = document.getElementById('project_titulo');
        const modalObjetivoSelect = document.getElementById('project_objetivo');
        const modalResultadoSelect = document.getElementById('project_resultado');
        const modalIndicadoresContainer = document.getElementById('indicadores-container');
        const abepIndicatorInput = document.getElementById('project_abep_indicator_input');
        const abepIndicatorHiddenInput = document.getElementById('project_abep_indicator');
        const abepIndicatorDropdown = document.getElementById('projectAbepIndicatorDropdown');
        const templateSelect = document.getElementById('template_select');
        const stagesContainer = document.getElementById('dynamic-stages-container');
        const templateCollapseSection = document.getElementById('projectCreateSectionTemplate');
        const accordionRoot = document.getElementById('projectCreateAccordion');
        const modalScrollContainer = addProjectModal?.querySelector('.project-create-body');
        const defaultResultOption = '<option value="" selected>Selecione um resultado esperado</option>';
        const defaultIndicatorPlaceholder = `
            <div class="indicator-placeholder">
                <i class="fas fa-info-circle"></i>
                <span>Selecione um resultado esperado para ver os indicadores disponíveis</span>
            </div>
        `;

        let templatesLoaded = false;
        let templatesLoading = false;
        let activeAccordionScrollFrame = null;
        let modalTriggerElement = null;
        let lastInteractionWasKeyboard = false;

        document.addEventListener('keydown', function () {
            lastInteractionWasKeyboard = true;
        }, true);

        document.addEventListener('pointerdown', function () {
            lastInteractionWasKeyboard = false;
        }, true);

        document.addEventListener('mousedown', function () {
            lastInteractionWasKeyboard = false;
        }, true);

        // Máscara para o campo Processo SEI
        const seiProcessInput = document.getElementById('project_sei_process');
        if (seiProcessInput) {
            seiProcessInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/[^0-9]/g, ''); // Remove tudo exceto números
                
                if (value.length > 0) {
                    // Formato: SEI-000000/000000/0000
                    let formatted = 'SEI-';
                    
                    if (value.length <= 6) {
                        formatted += value;
                    } else if (value.length <= 12) {
                        formatted += value.substring(0, 6) + '/' + value.substring(6);
                    } else {
                        formatted += value.substring(0, 6) + '/' + value.substring(6, 12) + '/' + value.substring(12, 16);
                    }
                    
                    e.target.value = formatted;
                }
            });
        }

        function getAreaFieldForValidation() {
            if (!addProjectForm) return null;
            const areaFields = Array.from(addProjectForm.querySelectorAll('[name="project_orgao_id"]'));
            if (!areaFields.length) return null;
            return areaFields.find(field => !field.disabled) || areaFields[0];
        }

        function isAreaReady() {
            const areaField = getAreaFieldForValidation();
            if (!areaField) return true;
            if (areaField.disabled) return false;

            const value = (areaField.value || '').trim();
            if (areaField.required || areaField.type === 'hidden') {
                return value.length > 0;
            }
            return true;
        }

        function areEssentialsValid() {
            if (!titleInput) return false;
            return titleInput.value.trim().length > 0 && isAreaReady();
        }

        function updateSubmitState() {
            if (!submitButton) return;
            const isValid = areEssentialsValid();
            submitButton.disabled = !isValid;
            submitButton.classList.toggle('is-disabled', !isValid);
        }

        function resetResultadoEIndicadores() {
            if (!modalResultadoSelect || !modalIndicadoresContainer) return;
            modalResultadoSelect.innerHTML = defaultResultOption;
            modalResultadoSelect.disabled = true;
            modalIndicadoresContainer.innerHTML = defaultIndicatorPlaceholder;
        }

        function loadResultados() {
            const objetivoId = modalObjetivoSelect.value;
            modalResultadoSelect.innerHTML = defaultResultOption;
            modalIndicadoresContainer.innerHTML = defaultIndicatorPlaceholder;
            
            if (!objetivoId) {
                modalResultadoSelect.disabled = true;
                return;
            }
            
            modalResultadoSelect.disabled = false;
            
            // Adiciona loading state
            modalResultadoSelect.innerHTML = '<option value="">Carregando resultados...</option>';
            
            fetch(`/api/resultados/${objetivoId}`)
                .then(response => response.json())
                .then(data => {
                    modalResultadoSelect.innerHTML = defaultResultOption;
                    
                    if(data && data.length > 0){
                        data.forEach(resultado => {
                            const option = document.createElement('option');
                            option.value = resultado.id;
                            option.textContent = resultado.descricao;
                            modalResultadoSelect.appendChild(option);
                        });
                    }
                })
                .catch(error => {
                    console.error('Erro ao carregar resultados:', error);
                    modalResultadoSelect.innerHTML = '<option value="">Erro ao carregar resultados</option>';
                });
        }

        function loadIndicadores() {
            const resultadoId = modalResultadoSelect.value;
            if (!resultadoId) {
                modalIndicadoresContainer.innerHTML = defaultIndicatorPlaceholder;
                return;
            }
            
            // Adiciona loading state
            modalIndicadoresContainer.innerHTML = `
                <div class="indicator-placeholder loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Carregando indicadores...</span>
                </div>
            `;
            
            fetch(`/api/indicadores/${resultadoId}`)
                .then(response => response.json())
                .then(data => {
                    modalIndicadoresContainer.innerHTML = '';
                    
                    if(data && data.length > 0){
                        data.forEach((indicador, index) => {
                            const div = document.createElement('div');
                            div.className = 'glass-checkbox-item';
                            div.innerHTML = `
                                <input class="glass-checkbox indicador-checkbox" type="checkbox" 
                                       name="project_indicadores" value="${indicador.id}" 
                                       id="indicador_${indicador.id}">
                                <label class="glass-checkbox-label" for="indicador_${indicador.id}">
                                    <span class="checkbox-custom"></span>
                                    <span class="checkbox-text">${indicador.descricao}</span>
                                </label>
                            `;
                            modalIndicadoresContainer.appendChild(div);
                            
                            // Adiciona animação escalonada
                            setTimeout(() => {
                                div.classList.add('animate-in');
                            }, index * 100);
                        });
                        
                        // Limitar seleção a 4 indicadores
                        document.querySelectorAll('.indicador-checkbox').forEach(checkbox => {
                            checkbox.addEventListener('change', function() {
                                const checkedCount = document.querySelectorAll('.indicador-checkbox:checked').length;
                                if (checkedCount > 4) {
                                    this.checked = false;
                                    showNotification('Você pode selecionar no máximo 4 indicadores', 'warning');
                                }
                            });
                        });
                    } else {
                        modalIndicadoresContainer.innerHTML = `
                            <div class="indicator-placeholder empty">
                                <i class="fas fa-exclamation-circle"></i>
                                <span>Nenhum indicador disponível para este resultado esperado</span>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Erro ao carregar indicadores:', error);
                    modalIndicadoresContainer.innerHTML = `
                        <div class="indicator-placeholder error">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span>Erro ao carregar indicadores</span>
                        </div>
                    `;
                });
        }

        function loadTemplates() {
            if (!templateSelect) {
                return Promise.resolve();
            }

            templateSelect.innerHTML = '<option value="">Carregando modelos...</option>';
            
            return fetch('/api/templates')
                .then(response => response.json())
                .then(data => {
                    templateSelect.innerHTML = '<option value="">Não importar / Limpar etapas</option>';
                    
                    if(data && data.length > 0){
                        data.forEach(template => {
                            const option = document.createElement('option');
                            option.value = template.id;
                            option.textContent = template.name;
                            templateSelect.appendChild(option);
                        });
                    }
                    templatesLoaded = true;
                    templatesLoading = false;
                })
                .catch(error => {
                    console.error('Erro ao carregar templates:', error);
                    templateSelect.innerHTML = '<option value="">Erro ao carregar modelos</option>';
                    templatesLoaded = false;
                    templatesLoading = false;
                });
        }

        function ensureTemplatesLoaded() {
            if (templatesLoaded || templatesLoading) {
                return;
            }
            templatesLoading = true;
            loadTemplates();
        }

        function getScrollBehavior() {
            const prefersReducedMotion = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            return prefersReducedMotion ? 'auto' : 'smooth';
        }

        function stopAccordionScrollAnimation() {
            if (activeAccordionScrollFrame !== null) {
                cancelAnimationFrame(activeAccordionScrollFrame);
                activeAccordionScrollFrame = null;
            }
        }

        function animateAccordionScroll(targetTop) {
            if (!modalScrollContainer) {
                return;
            }

            const behavior = getScrollBehavior();
            if (behavior === 'auto') {
                stopAccordionScrollAnimation();
                modalScrollContainer.scrollTop = targetTop;
                return;
            }

            const startTop = modalScrollContainer.scrollTop;
            const distance = targetTop - startTop;
            if (Math.abs(distance) < 1) {
                return;
            }

            stopAccordionScrollAnimation();
            const duration = Math.min(620, Math.max(320, Math.abs(distance) * 0.5));
            const startTime = performance.now();

            function easeInOutCubic(t) {
                return t < 0.5
                    ? 4 * t * t * t
                    : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            function step(now) {
                const progress = Math.min(1, (now - startTime) / duration);
                const eased = easeInOutCubic(progress);
                modalScrollContainer.scrollTop = startTop + (distance * eased);

                if (progress < 1) {
                    activeAccordionScrollFrame = requestAnimationFrame(step);
                    return;
                }

                activeAccordionScrollFrame = null;
                modalScrollContainer.scrollTop = targetTop;
            }

            activeAccordionScrollFrame = requestAnimationFrame(step);
        }

        function centerAccordionItemInModal(itemElement) {
            if (!itemElement || !modalScrollContainer) {
                return;
            }

            const containerRect = modalScrollContainer.getBoundingClientRect();
            const itemRect = itemElement.getBoundingClientRect();
            const itemHeight = itemRect.height;
            const visibleHeight = modalScrollContainer.clientHeight;
            const boundedItemHeight = Math.min(itemHeight, visibleHeight);

            const itemTopWithinContainer = itemRect.top - containerRect.top + modalScrollContainer.scrollTop;
            const targetTop = itemTopWithinContainer - ((visibleHeight - boundedItemHeight) / 2);
            const maxTop = Math.max(0, modalScrollContainer.scrollHeight - visibleHeight);
            const clampedTop = Math.min(maxTop, Math.max(0, targetTop));
            animateAccordionScroll(clampedTop);
        }

        function centerAccordionItemAfterLayout(collapseElement) {
            if (!collapseElement) {
                return;
            }

            const accordionItem = collapseElement.closest('.accordion-item');
            if (!accordionItem) {
                return;
            }

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    centerAccordionItemInModal(accordionItem);
                });
            });
        }

        // --- Import de modelo de etapas (preview read-only) ---------------
        const templateImportPreview = document.getElementById('tpl-import-preview');
        const templateImportEmpty = document.getElementById('tpl-import-empty');
        const templateImportList = document.getElementById('tpl-import-preview-list');
        const templateImportStageCount = document.getElementById('tpl-import-stage-count');
        const templateImportTotalDuration = document.getElementById('tpl-import-total-duration');
        const templateImportFooter = document.getElementById('tpl-import-preview-footer');
        const templateImportFooterStart = document.getElementById('tpl-import-preview-start');
        const templateImportFooterEnd = document.getElementById('tpl-import-preview-end');
        const templateImportHiddenId = document.getElementById('project_template_id');
        let templateImportCurrentStages = [];

        function parseIsoDate(iso) {
            if (!iso || typeof iso !== 'string') return null;
            const parts = iso.split('-').map(Number);
            if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
            return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
        }

        function addDaysUtc(date, days) {
            const copy = new Date(date.getTime());
            copy.setUTCDate(copy.getUTCDate() + days);
            return copy;
        }

        function formatIsoDate(date) {
            if (!date) return '';
            const y = date.getUTCFullYear();
            const m = String(date.getUTCMonth() + 1).padStart(2, '0');
            const d = String(date.getUTCDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatBrDate(date) {
            if (!date) return '';
            const d = String(date.getUTCDate()).padStart(2, '0');
            const m = String(date.getUTCMonth() + 1).padStart(2, '0');
            const y = date.getUTCFullYear();
            return `${d}/${m}/${y}`;
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function clearTemplateImportPreview() {
            templateImportCurrentStages = [];
            if (templateImportHiddenId) templateImportHiddenId.value = '';
            if (templateImportList) templateImportList.innerHTML = '';
            if (stagesContainer) stagesContainer.innerHTML = '';
            if (templateImportPreview) templateImportPreview.hidden = true;
            if (templateImportFooter) templateImportFooter.hidden = true;
            if (templateImportEmpty) templateImportEmpty.hidden = false;
        }

        function renderTemplateImportPreview() {
            if (!templateImportList) return;
            const stages = templateImportCurrentStages;
            templateImportList.innerHTML = '';
            if (stagesContainer) stagesContainer.innerHTML = '';

            if (!stages.length) {
                clearTemplateImportPreview();
                return;
            }

            const startInput = document.getElementById('project_start_date');
            const startDate = startInput ? parseIsoDate(startInput.value) : null;
            let cursor = startDate ? new Date(startDate.getTime()) : null;
            let totalDuration = 0;
            let lastEnd = null;

            stages.forEach((etapa, index) => {
                const duration = Math.max(1, parseInt(etapa.duration, 10) || 1);
                totalDuration += duration;

                let rangeText = `${duration}d`;
                if (cursor) {
                    const stageStart = new Date(cursor.getTime());
                    const stageEnd = addDaysUtc(stageStart, duration - 1);
                    rangeText = `${formatBrDate(stageStart)} → ${formatBrDate(stageEnd)} · ${duration}d`;
                    cursor = addDaysUtc(stageEnd, 1);
                    lastEnd = stageEnd;
                }

                const card = document.createElement('div');
                card.className = 'tpl-import-stage';
                card.innerHTML = `
                    <span class="tpl-import-stage-number">${index + 1}</span>
                    <div class="tpl-import-stage-body">
                        <div class="tpl-import-stage-name">${escapeHtml(etapa.name)}</div>
                        <div class="tpl-import-stage-range">${escapeHtml(rangeText)}</div>
                    </div>
                `;
                templateImportList.appendChild(card);

                if (stagesContainer) {
                    const hiddenName = document.createElement('input');
                    hiddenName.type = 'hidden';
                    hiddenName.name = 'etapa_descricao';
                    hiddenName.value = etapa.name || '';
                    stagesContainer.appendChild(hiddenName);

                    const hiddenDuration = document.createElement('input');
                    hiddenDuration.type = 'hidden';
                    hiddenDuration.name = 'etapa_duration';
                    hiddenDuration.value = String(duration);
                    stagesContainer.appendChild(hiddenDuration);
                }
            });

            if (templateImportStageCount) templateImportStageCount.textContent = String(stages.length);
            if (templateImportTotalDuration) templateImportTotalDuration.textContent = String(totalDuration);
            if (templateImportPreview) templateImportPreview.hidden = false;
            if (templateImportEmpty) templateImportEmpty.hidden = true;

            if (templateImportFooter) {
                if (startDate && lastEnd) {
                    if (templateImportFooterStart) templateImportFooterStart.textContent = formatBrDate(startDate);
                    if (templateImportFooterEnd) templateImportFooterEnd.textContent = formatBrDate(lastEnd);
                    templateImportFooter.hidden = false;
                } else {
                    templateImportFooter.hidden = true;
                }
            }
        }

        function loadTemplateStages() {
            const templateId = templateSelect ? templateSelect.value : '';
            if (templateImportHiddenId) templateImportHiddenId.value = templateId || '';

            if (!templateId) {
                clearTemplateImportPreview();
                return;
            }

            if (templateImportEmpty) templateImportEmpty.hidden = true;
            if (templateImportPreview) {
                templateImportPreview.hidden = false;
                if (templateImportList) {
                    templateImportList.innerHTML = '<div class="tpl-import-loading"><i class="fas fa-spinner fa-spin"></i><span>Carregando etapas…</span></div>';
                }
            }

            fetch(`/api/templates/${templateId}`)
                .then(response => response.json())
                .then(data => {
                    templateImportCurrentStages = Array.isArray(data) ? data.slice() : [];
                    templateImportCurrentStages.sort((a, b) => (a.order || 0) - (b.order || 0));
                    renderTemplateImportPreview();
                })
                .catch(error => {
                    console.error('Erro ao carregar etapas do template:', error);
                    if (templateImportList) {
                        templateImportList.innerHTML = '<div class="tpl-import-error"><i class="fas fa-exclamation-triangle"></i><span>Erro ao carregar etapas do modelo.</span></div>';
                    }
                    templateImportCurrentStages = [];
                    if (stagesContainer) stagesContainer.innerHTML = '';
                });
        }

        const templateStartInputEl = document.getElementById('project_start_date');
        if (templateStartInputEl) {
            templateStartInputEl.addEventListener('change', function () {
                if (templateImportCurrentStages.length) {
                    renderTemplateImportPreview();
                }
            });
        }

        // Função para mostrar notificações
        function showNotification(message, type = 'info') {
            // Implementar sistema de notificação toast aqui
            alert(message); // Temporário - pode ser substituído por um toast mais elegante
        }

        function setupAbepIndicatorCombobox(input, hiddenInput, dropdown) {
            if (!input || !hiddenInput || !dropdown) {
                return { reset: function() {} };
            }

            const options = Array.from(dropdown.querySelectorAll('.project-search-option[data-value]'));
            const emptyState = dropdown.querySelector('[data-abep-empty="1"]');
            const defaultDropdownMaxHeight = 220;
            const minDropdownHeight = 96;
            const preferredDropdownHeight = 140;
            const dropdownOffset = 3;

            if (!options.length) {
                return { reset: function() {} };
            }

            function clearActiveOption() {
                options.forEach(option => option.classList.remove('active'));
            }

            function filterOptions() {
                const searchTerm = (input.value || '').trim().toLowerCase();
                let visibleCount = 0;
                options.forEach(option => {
                    const label = (option.getAttribute('data-label') || option.textContent || '').toLowerCase();
                    const value = (option.getAttribute('data-value') || '').toLowerCase();
                    const matches = !searchTerm || label.includes(searchTerm) || value.includes(searchTerm);
                    option.classList.toggle('hidden-by-filter', !matches);
                    option.classList.remove('active');
                    if (matches) {
                        visibleCount += 1;
                    }
                });

                if (emptyState) {
                    emptyState.hidden = visibleCount > 0;
                }

                return visibleCount;
            }

            function getVisibleOptions() {
                return options.filter(option => !option.classList.contains('hidden-by-filter'));
            }

            function updateDropdownPlacement() {
                dropdown.classList.remove('project-search-dropdown-up');
                dropdown.style.maxHeight = `${defaultDropdownMaxHeight}px`;

                const inputRect = input.getBoundingClientRect();
                const containerRect = modalScrollContainer
                    ? modalScrollContainer.getBoundingClientRect()
                    : { top: 0, bottom: window.innerHeight };

                const availableBelow = Math.floor(containerRect.bottom - inputRect.bottom - dropdownOffset - 6);
                const availableAbove = Math.floor(inputRect.top - containerRect.top - dropdownOffset - 6);

                const canOpenDown = availableBelow >= preferredDropdownHeight;
                const canOpenUp = availableAbove >= preferredDropdownHeight;

                let openUp = false;
                let availableSpace = availableBelow;

                if ((!canOpenDown && canOpenUp && availableAbove > availableBelow) ||
                    (availableBelow <= minDropdownHeight && availableAbove > availableBelow)) {
                    openUp = true;
                    availableSpace = availableAbove;
                }

                const fallbackSpace = Math.max(minDropdownHeight, availableBelow, availableAbove);
                const normalizedSpace = availableSpace > 0 ? availableSpace : fallbackSpace;
                const computedHeight = Math.min(defaultDropdownMaxHeight, normalizedSpace);

                dropdown.style.maxHeight = `${computedHeight}px`;
                dropdown.classList.toggle('project-search-dropdown-up', openUp);
            }

            function showDropdown() {
                filterOptions();
                updateDropdownPlacement();
                dropdown.removeAttribute('hidden');
                input.setAttribute('aria-expanded', 'true');
            }

            function hideDropdown() {
                dropdown.setAttribute('hidden', '');
                input.setAttribute('aria-expanded', 'false');
                clearActiveOption();
            }

            function selectOption(option) {
                hiddenInput.value = option.getAttribute('data-value') || '';
                input.value = option.getAttribute('data-label') || option.textContent || '';
                hideDropdown();
            }

            input.addEventListener('focus', showDropdown);
            input.addEventListener('click', showDropdown);
            input.addEventListener('input', function() {
                hiddenInput.value = '';
                showDropdown();
            });

            input.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    hideDropdown();
                    return;
                }

                const visibleOptions = getVisibleOptions();
                if (!visibleOptions.length) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                    }
                    return;
                }

                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    const activeOption = dropdown.querySelector('.project-search-option.active');
                    let index = visibleOptions.indexOf(activeOption);
                    index = index < 0 ? 0 : Math.min(index + 1, visibleOptions.length - 1);
                    clearActiveOption();
                    visibleOptions[index].classList.add('active');
                    visibleOptions[index].scrollIntoView({ block: 'nearest' });
                    return;
                }

                if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    const activeOption = dropdown.querySelector('.project-search-option.active');
                    let index = visibleOptions.indexOf(activeOption);
                    index = index < 0 ? visibleOptions.length - 1 : Math.max(index - 1, 0);
                    clearActiveOption();
                    visibleOptions[index].classList.add('active');
                    visibleOptions[index].scrollIntoView({ block: 'nearest' });
                    return;
                }

                if (event.key === 'Enter') {
                    const activeOption = dropdown.querySelector('.project-search-option.active');
                    if (activeOption && !activeOption.classList.contains('hidden-by-filter')) {
                        event.preventDefault();
                        selectOption(activeOption);
                    }
                }
            });

            options.forEach(option => {
                option.addEventListener('mousedown', function(event) {
                    event.preventDefault();
                });

                option.addEventListener('click', function() {
                    selectOption(option);
                });
            });

            document.addEventListener('click', function(event) {
                if (!dropdown.contains(event.target) && event.target !== input) {
                    hideDropdown();
                }
            });

            if (modalScrollContainer) {
                modalScrollContainer.addEventListener('scroll', function() {
                    if (!dropdown.hasAttribute('hidden')) {
                        updateDropdownPlacement();
                    }
                }, { passive: true });
            }

            window.addEventListener('resize', function() {
                if (!dropdown.hasAttribute('hidden')) {
                    updateDropdownPlacement();
                }
            });

            input.addEventListener('blur', function() {
                setTimeout(function() {
                    if (!dropdown.contains(document.activeElement) && document.activeElement !== input) {
                        hideDropdown();
                    }
                }, 120);
            });

            return {
                reset: function() {
                    hiddenInput.value = '';
                    input.value = '';
                    options.forEach(option => {
                        option.classList.remove('hidden-by-filter');
                        option.classList.remove('active');
                    });
                    if (emptyState) {
                        emptyState.hidden = true;
                    }
                    hideDropdown();
                }
            };
        }

        const abepComboboxControl = setupAbepIndicatorCombobox(
            abepIndicatorInput,
            abepIndicatorHiddenInput,
            abepIndicatorDropdown
        );

        // Event listeners
        if (modalObjetivoSelect) {
            modalObjetivoSelect.addEventListener('change', loadResultados);
        }
        
        if (modalResultadoSelect) {
            modalResultadoSelect.addEventListener('change', loadIndicadores);
        }
        
        if (templateSelect) {
            templateSelect.addEventListener('change', loadTemplateStages);
        }

        if (titleInput) {
            titleInput.addEventListener('input', updateSubmitState);
        }

        if (addProjectForm) {
            const areaFields = Array.from(addProjectForm.querySelectorAll('[name="project_orgao_id"]'));
            areaFields.forEach(field => {
                const eventName = field.tagName === 'SELECT' ? 'change' : 'input';
                field.addEventListener(eventName, updateSubmitState);
            });

            addProjectForm.addEventListener('submit', function(event) {
                if (!areEssentialsValid()) {
                    event.preventDefault();
                    event.stopPropagation();
                    updateSubmitState();
                    if (titleInput && !titleInput.value.trim()) {
                        titleInput.focus();
                    }
                }
            });
        }

        if (templateCollapseSection) {
            templateCollapseSection.addEventListener('shown.bs.collapse', ensureTemplatesLoaded);
        }

        if (accordionRoot) {
            accordionRoot.querySelectorAll('.accordion-collapse').forEach(collapseEl => {
                collapseEl.addEventListener('shown.bs.collapse', function() {
                    centerAccordionItemAfterLayout(collapseEl);
                });
            });
        }

        // Inicialização do modal
        if (addProjectModal) {
            addProjectModal.addEventListener('show.bs.modal', function (event) {
                modalTriggerElement = event.relatedTarget && typeof event.relatedTarget.blur === 'function'
                    ? event.relatedTarget
                    : null;
            });

            addProjectModal.addEventListener('shown.bs.modal', function () {
                updateSubmitState();
                setTimeout(() => {
                    if (titleInput) {
                        titleInput.focus();
                    }
                }, 120);
            });
            
            // Limpar formulário quando modal for fechado
            addProjectModal.addEventListener('hidden.bs.modal', function () {
                if (document.activeElement && addProjectModal.contains(document.activeElement) && typeof document.activeElement.blur === 'function') {
                    document.activeElement.blur();
                }

                if (modalTriggerElement && !lastInteractionWasKeyboard && typeof modalTriggerElement.blur === 'function') {
                    modalTriggerElement.blur();
                }

                if (addProjectForm) {
                    addProjectForm.reset();
                }

                if (accordionRoot) {
                    if (window.bootstrap && window.bootstrap.Collapse) {
                        accordionRoot.querySelectorAll('.accordion-collapse.show').forEach(collapseEl => {
                            const instance = window.bootstrap.Collapse.getOrCreateInstance(collapseEl, { toggle: false });
                            instance.hide();
                        });
                    }

                    accordionRoot.querySelectorAll('.project-create-accordion-button').forEach(buttonEl => {
                        buttonEl.classList.add('collapsed');
                        buttonEl.setAttribute('aria-expanded', 'false');
                        if (typeof buttonEl.blur === 'function') {
                            buttonEl.blur();
                        }
                    });

                    accordionRoot.querySelectorAll('.accordion-collapse').forEach(collapseEl => {
                        collapseEl.classList.remove('show', 'collapsing');
                        collapseEl.style.height = '';
                    });
                }

                resetResultadoEIndicadores();

                if (stagesContainer) {
                    stagesContainer.innerHTML = '';
                }
                if (templateSelect) {
                    templateSelect.innerHTML = '<option value="">Não importar / Limpar etapas</option>';
                }
                if (typeof clearTemplateImportPreview === 'function') {
                    clearTemplateImportPreview();
                }

                templatesLoaded = false;
                templatesLoading = false;
                abepComboboxControl.reset();
                updateSubmitState();
                modalTriggerElement = null;
            });
        }

        // Adiciona interações de hover nos cards glass
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.classList.add('glass-card-hover');
            });
            
            card.addEventListener('mouseleave', function() {
                this.classList.remove('glass-card-hover');
            });
        });

        // Melhora a experiência dos campos de formulário
        document.querySelectorAll('.form-control-glass, .form-select-glass, .form-control-glass-enhanced, .form-select-glass-enhanced, .form-control-glass-full, .textarea-glass-full').forEach(field => {
            field.addEventListener('focus', function() {
                const group = this.closest('.form-group-glass');
                if (group) {
                    group.classList.add('field-focused');
                }
            });
            
            field.addEventListener('blur', function() {
                const group = this.closest('.form-group-glass');
                if (group) {
                    group.classList.remove('field-focused');
                }
            });
        });

        resetResultadoEIndicadores();
        updateSubmitState();

        if (window.CalDatetimePicker) {
            var psd = document.getElementById('project_start_date');
            if (psd) CalDatetimePicker.initDatePicker(psd);
        }
    });
</script>
