<script nonce="{{ csp_nonce }}">
// Mostra a opção "Inventário" em Projetos Especiais apenas quando o órgão
// selecionado é um dos órgãos autorizados (regra de negócio em catalogs/inventario.py).
// A sigla do órgão é lida do atributo data-sigla da opção/input selecionado.
(function () {
    'use strict';
    const ALLOWED = ({{ INVENTARIO_ORGAO_SIGLAS|tojson }}).map(function (sigla) {
        return sigla.trim().toLowerCase();
    });

    function selectedOrgaoSigla(orgaoFieldName) {
        const fields = document.querySelectorAll('[name="' + orgaoFieldName + '"]');
        for (const field of fields) {
            if (field.disabled) continue;
            if (field.tagName === 'SELECT') {
                const opt = field.options[field.selectedIndex];
                if (opt && opt.dataset.sigla) return opt.dataset.sigla;
            } else if (field.dataset && field.dataset.sigla) {
                return field.dataset.sigla;
            }
        }
        // Fallback: campo único desabilitado (órgão fixo do usuário).
        for (const field of fields) {
            if (field.dataset && field.dataset.sigla) return field.dataset.sigla;
        }
        return '';
    }

    window.bindInventarioSpecialToggle = function (orgaoFieldName, specialSelectId) {
        const special = document.getElementById(specialSelectId);
        if (!special) return;
        const option = special.querySelector('option[value="Inventário"]');
        if (!option) return;

        function sync() {
            const sigla = (selectedOrgaoSigla(orgaoFieldName) || '').trim().toLowerCase();
            const allowed = ALLOWED.indexOf(sigla) !== -1;
            option.hidden = !allowed;
            option.disabled = !allowed;
            if (!allowed && special.value === 'Inventário') {
                special.value = '';
            }
        }

        document.querySelectorAll('[name="' + orgaoFieldName + '"]').forEach(function (field) {
            field.addEventListener('change', sync);
        });
        sync();
    };
})();
</script>
