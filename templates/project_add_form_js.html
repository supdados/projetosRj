<script>
    // Lógica Unificada para o Modal de Adicionar Projeto - Quick Create
    document.addEventListener('DOMContentLoaded', function() {
        const addProjectModal = document.getElementById('addProjectModal');
        const addProjectForm = document.getElementById('addProjectFormModal');
        const submitButton = document.getElementById('createProjectSubmitBtn');
        const titleInput = document.getElementById('project_titulo');
        const modalObjetivoSelect = document.getElementById('project_objetivo');
        const modalResultadoSelect = document.getElementById('project_resultado');
        const modalIndicadoresContainer = document.getElementById('indicadores-container');
        const abepIndicatorGroupSelect = document.getElementById('project_abep_indicator_group');
        const abepIndicatorSelect = document.getElementById('project_abep_indicator');
        const templateSelect = document.getElementById('template_select');
        const stagesContainer = document.getElementById('dynamic-stages-container');
        const templateCollapseSection = document.getElementById('projectCreateSectionTemplate');
        const accordionRoot = document.getElementById('projectCreateAccordion');
        const defaultResultOption = '<option value="" selected>Selecione um resultado esperado</option>';
        const defaultIndicatorPlaceholder = `
            <div class="indicator-placeholder">
                <i class="fas fa-info-circle"></i>
                <span>Selecione um resultado esperado para ver os indicadores disponíveis</span>
            </div>
        `;

        let templatesLoaded = false;
        let templatesLoading = false;

        // Máscara para o campo Processo SEI
        const seiProcessInput = document.getElementById('project_sei_process');
        if (seiProcessInput) {
            seiProcessInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/[^0-9]/g, ''); // Remove tudo exceto números
                
                if (value.length > 0) {
                    // Formato: SEI-000000/000000/0000
                    let formatted = 'SEI-';
                    
                    if (value.length <= 6) {
                        formatted += value;
                    } else if (value.length <= 12) {
                        formatted += value.substring(0, 6) + '/' + value.substring(6);
                    } else {
                        formatted += value.substring(0, 6) + '/' + value.substring(6, 12) + '/' + value.substring(12, 16);
                    }
                    
                    e.target.value = formatted;
                }
            });
        }

        function getAreaFieldForValidation() {
            if (!addProjectForm) return null;
            const areaFields = Array.from(addProjectForm.querySelectorAll('[name="project_area_responsavel"]'));
            if (!areaFields.length) return null;
            return areaFields.find(field => !field.disabled) || areaFields[0];
        }

        function isAreaReady() {
            const areaField = getAreaFieldForValidation();
            if (!areaField) return true;
            if (areaField.disabled) return false;

            const value = (areaField.value || '').trim();
            if (areaField.required || areaField.type === 'hidden') {
                return value.length > 0;
            }
            return true;
        }

        function areEssentialsValid() {
            if (!titleInput) return false;
            return titleInput.value.trim().length > 0 && isAreaReady();
        }

        function updateSubmitState() {
            if (!submitButton) return;
            const isValid = areEssentialsValid();
            submitButton.disabled = !isValid;
            submitButton.classList.toggle('is-disabled', !isValid);
        }

        function resetResultadoEIndicadores() {
            if (!modalResultadoSelect || !modalIndicadoresContainer) return;
            modalResultadoSelect.innerHTML = defaultResultOption;
            modalResultadoSelect.disabled = true;
            modalIndicadoresContainer.innerHTML = defaultIndicatorPlaceholder;
        }

        function loadResultados() {
            const objetivoId = modalObjetivoSelect.value;
            modalResultadoSelect.innerHTML = defaultResultOption;
            modalIndicadoresContainer.innerHTML = defaultIndicatorPlaceholder;
            
            if (!objetivoId) {
                modalResultadoSelect.disabled = true;
                return;
            }
            
            modalResultadoSelect.disabled = false;
            
            // Adiciona loading state
            modalResultadoSelect.innerHTML = '<option value="">Carregando resultados...</option>';
            
            fetch(`/api/resultados/${objetivoId}`)
                .then(response => response.json())
                .then(data => {
                    modalResultadoSelect.innerHTML = defaultResultOption;
                    
                    if(data && data.length > 0){
                        data.forEach(resultado => {
                            const option = document.createElement('option');
                            option.value = resultado.id;
                            option.textContent = resultado.descricao;
                            modalResultadoSelect.appendChild(option);
                        });
                    }
                })
                .catch(error => {
                    console.error('Erro ao carregar resultados:', error);
                    modalResultadoSelect.innerHTML = '<option value="">Erro ao carregar resultados</option>';
                });
        }

        function loadIndicadores() {
            const resultadoId = modalResultadoSelect.value;
            if (!resultadoId) {
                modalIndicadoresContainer.innerHTML = defaultIndicatorPlaceholder;
                return;
            }
            
            // Adiciona loading state
            modalIndicadoresContainer.innerHTML = `
                <div class="indicator-placeholder loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Carregando indicadores...</span>
                </div>
            `;
            
            fetch(`/api/indicadores/${resultadoId}`)
                .then(response => response.json())
                .then(data => {
                    modalIndicadoresContainer.innerHTML = '';
                    
                    if(data && data.length > 0){
                        data.forEach((indicador, index) => {
                            const div = document.createElement('div');
                            div.className = 'glass-checkbox-item';
                            div.innerHTML = `
                                <input class="glass-checkbox indicador-checkbox" type="checkbox" 
                                       name="project_indicadores" value="${indicador.id}" 
                                       id="indicador_${indicador.id}">
                                <label class="glass-checkbox-label" for="indicador_${indicador.id}">
                                    <span class="checkbox-custom"></span>
                                    <span class="checkbox-text">${indicador.descricao}</span>
                                </label>
                            `;
                            modalIndicadoresContainer.appendChild(div);
                            
                            // Adiciona animação escalonada
                            setTimeout(() => {
                                div.classList.add('animate-in');
                            }, index * 100);
                        });
                        
                        // Limitar seleção a 4 indicadores
                        document.querySelectorAll('.indicador-checkbox').forEach(checkbox => {
                            checkbox.addEventListener('change', function() {
                                const checkedCount = document.querySelectorAll('.indicador-checkbox:checked').length;
                                if (checkedCount > 4) {
                                    this.checked = false;
                                    showNotification('Você pode selecionar no máximo 4 indicadores', 'warning');
                                }
                            });
                        });
                    } else {
                        modalIndicadoresContainer.innerHTML = `
                            <div class="indicator-placeholder empty">
                                <i class="fas fa-exclamation-circle"></i>
                                <span>Nenhum indicador disponível para este resultado esperado</span>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Erro ao carregar indicadores:', error);
                    modalIndicadoresContainer.innerHTML = `
                        <div class="indicator-placeholder error">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span>Erro ao carregar indicadores</span>
                        </div>
                    `;
                });
        }

        function loadTemplates() {
            if (!templateSelect) {
                return Promise.resolve();
            }

            templateSelect.innerHTML = '<option value="">Carregando modelos...</option>';
            
            return fetch('/api/templates')
                .then(response => response.json())
                .then(data => {
                    templateSelect.innerHTML = '<option value="">Não importar / Limpar etapas</option>';
                    
                    if(data && data.length > 0){
                        data.forEach(template => {
                            const option = document.createElement('option');
                            option.value = template.id;
                            option.textContent = template.name;
                            templateSelect.appendChild(option);
                        });
                    }
                    templatesLoaded = true;
                    templatesLoading = false;
                })
                .catch(error => {
                    console.error('Erro ao carregar templates:', error);
                    templateSelect.innerHTML = '<option value="">Erro ao carregar modelos</option>';
                    templatesLoaded = false;
                    templatesLoading = false;
                });
        }

        function ensureTemplatesLoaded() {
            if (templatesLoaded || templatesLoading) {
                return;
            }
            templatesLoading = true;
            loadTemplates();
        }

        function loadTemplateStages() {
            const templateId = templateSelect.value;
            stagesContainer.innerHTML = '';
            
            if (!templateId) {
                return;
            }
            
            // Adiciona loading state
            stagesContainer.innerHTML = `
                <div class="stages-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Carregando etapas do modelo...</span>
                </div>
            `;
            
            fetch(`/api/templates/${templateId}`)
                .then(response => response.json())
                .then(data => {
                    stagesContainer.innerHTML = '';
                    
                    if(data && data.length > 0){
                        data.forEach((etapa, index) => {
                            const stageDiv = document.createElement('div');
                            stageDiv.className = 'glass-stage-item';
                            stageDiv.innerHTML = `
                                <div class="stage-number">${index + 1}</div>
                                <div class="stage-content">
                                    <label class="form-label-glass">
                                        <i class="fas fa-tasks label-icon"></i>
                                        Etapa ${index + 1} <span style="color: #6c757d; font-size: 0.85rem;">(${etapa.duration || 1} dias)</span>
                                    </label>
                                    <input type="text" class="form-control-glass" 
                                           name="etapa_descricao" value="${etapa.name}" 
                                           placeholder="Descrição da etapa">
                                    <input type="hidden" name="etapa_duration" value="${etapa.duration || 1}">
                                </div>
                            `;
                            stagesContainer.appendChild(stageDiv);
                            
                            // Animação escalonada
                            setTimeout(() => {
                                stageDiv.classList.add('animate-in');
                            }, index * 150);
                        });
                    }
                })
                .catch(error => {
                    console.error('Erro ao carregar etapas do template:', error);
                    stagesContainer.innerHTML = `
                        <div class="stages-error">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span>Erro ao carregar etapas do modelo</span>
                        </div>
                    `;
                });
        }

        // Função para mostrar notificações
        function showNotification(message, type = 'info') {
            // Implementar sistema de notificação toast aqui
            alert(message); // Temporário - pode ser substituído por um toast mais elegante
        }

        function setupAbepGroupFilter(groupSelect, select) {
            if (!groupSelect || !select) {
                return { reset: function() {} };
            }

            const allOptions = Array.from(select.options).map(option => ({
                value: option.value,
                text: option.textContent
            }));

            if (allOptions.length === 0) {
                return { reset: function() {} };
            }

            const placeholder = allOptions[0];
            const selectableOptions = allOptions.slice(1);

            function renderOptions(groupValue) {
                const currentSelected = select.value;
                const normalizedGroup = (groupValue || '').trim();

                const filtered = selectableOptions.filter(item => {
                    if (!normalizedGroup) return true;
                    const rawValue = (item.value || '').trim();
                    return rawValue.startsWith(`${normalizedGroup}.`) || rawValue === normalizedGroup;
                });

                select.innerHTML = '';
                const placeholderOption = document.createElement('option');
                placeholderOption.value = placeholder.value;
                placeholderOption.textContent = placeholder.text;
                select.appendChild(placeholderOption);

                filtered.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.value;
                    option.textContent = item.text;
                    select.appendChild(option);
                });

                if (currentSelected && Array.from(select.options).some(opt => opt.value === currentSelected)) {
                    select.value = currentSelected;
                } else {
                    select.value = '';
                }
            }

            groupSelect.addEventListener('change', function() {
                renderOptions(groupSelect.value);
            });

            return {
                reset: function() {
                    groupSelect.value = '';
                    renderOptions('');
                    select.value = '';
                }
            };
        }

        const abepGroupControl = setupAbepGroupFilter(abepIndicatorGroupSelect, abepIndicatorSelect);

        // Event listeners
        if (modalObjetivoSelect) {
            modalObjetivoSelect.addEventListener('change', loadResultados);
        }
        
        if (modalResultadoSelect) {
            modalResultadoSelect.addEventListener('change', loadIndicadores);
        }
        
        if (templateSelect) {
            templateSelect.addEventListener('change', loadTemplateStages);
        }

        if (titleInput) {
            titleInput.addEventListener('input', updateSubmitState);
        }

        if (addProjectForm) {
            const areaFields = Array.from(addProjectForm.querySelectorAll('[name="project_area_responsavel"]'));
            areaFields.forEach(field => {
                const eventName = field.tagName === 'SELECT' ? 'change' : 'input';
                field.addEventListener(eventName, updateSubmitState);
            });

            addProjectForm.addEventListener('submit', function(event) {
                if (!areEssentialsValid()) {
                    event.preventDefault();
                    event.stopPropagation();
                    updateSubmitState();
                    if (titleInput && !titleInput.value.trim()) {
                        titleInput.focus();
                    }
                }
            });
        }

        if (templateCollapseSection) {
            templateCollapseSection.addEventListener('shown.bs.collapse', ensureTemplatesLoaded);
        }

        // Inicialização do modal
        if (addProjectModal) {
            addProjectModal.addEventListener('shown.bs.modal', function () {
                updateSubmitState();
                setTimeout(() => {
                    if (titleInput) {
                        titleInput.focus();
                    }
                }, 120);
            });
            
            // Limpar formulário quando modal for fechado
            addProjectModal.addEventListener('hidden.bs.modal', function () {
                if (addProjectForm) {
                    addProjectForm.reset();
                }

                if (accordionRoot && window.bootstrap && window.bootstrap.Collapse) {
                    accordionRoot.querySelectorAll('.accordion-collapse.show').forEach(collapseEl => {
                        const instance = window.bootstrap.Collapse.getOrCreateInstance(collapseEl, { toggle: false });
                        instance.hide();
                    });
                }

                resetResultadoEIndicadores();

                if (stagesContainer) {
                    stagesContainer.innerHTML = '';
                }
                if (templateSelect) {
                    templateSelect.innerHTML = '<option value="">Não importar / Limpar etapas</option>';
                }

                templatesLoaded = false;
                templatesLoading = false;
                abepGroupControl.reset();
                updateSubmitState();
            });
        }

        // Adiciona interações de hover nos cards glass
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.classList.add('glass-card-hover');
            });
            
            card.addEventListener('mouseleave', function() {
                this.classList.remove('glass-card-hover');
            });
        });

        // Melhora a experiência dos campos de formulário
        document.querySelectorAll('.form-control-glass, .form-select-glass, .form-control-glass-enhanced, .form-select-glass-enhanced, .form-control-glass-full, .textarea-glass-full').forEach(field => {
            field.addEventListener('focus', function() {
                const group = this.closest('.form-group-glass');
                if (group) {
                    group.classList.add('field-focused');
                }
            });
            
            field.addEventListener('blur', function() {
                const group = this.closest('.form-group-glass');
                if (group) {
                    group.classList.remove('field-focused');
                }
            });
        });

        resetResultadoEIndicadores();
        updateSubmitState();
    });
</script>
