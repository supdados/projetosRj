<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Sistema de gerenciamento de projetos - Controle e acompanhe seus projetos de forma eficiente" />
		<title>ProjetosRJ</title>

		<link rel="icon" href="/static/favicon.ico?v=20260801c" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/static/img/brand/favicon.svg?v=20260801c" />
		<link rel="icon" type="image/png" sizes="32x32" href="/static/img/brand/favicon-32.png?v=20260801c" />
		<link rel="icon" type="image/png" sizes="16x16" href="/static/img/brand/favicon-16.png?v=20260801c" />

		<!-- Placeholders %...% substituidos por routes/spa.py ao servir o bundle;
		     em dev (vite) permanecem literais e o client.ts/ChatbotWidget os ignoram. -->
		<meta name="csrf-token" content="%CSRF_TOKEN%" />
		<meta name="chatbot-base-url" content="%CHATBOT_BASE_URL%" />
		<!-- Valor inicial pre-hidratacao, sincronizado com --ds-color-surface-topnav (tema claro). -->
		<meta name="theme-color" content="#004973" id="appThemeColorMeta" />
		<!-- Anti-flash de tema: roda ANTES do primeiro paint (sincrono, no head). -->
		<script nonce="%CSP_NONCE%">
			(function () {
				var storageKey = 'projetosrj.theme';
				var root = document.documentElement;
				var theme = 'light';
				// Modo escuro incompleto: deteccao (localStorage + prefers-color-scheme)
				// desligada ate o tema ser finalizado. Reativar virando este flag.
				var darkModeEnabled = false;
				if (darkModeEnabled) {
					try {
						var storedTheme = window.localStorage.getItem(storageKey);
						if (storedTheme === 'light' || storedTheme === 'dark') {
							theme = storedTheme;
						} else if (
							window.matchMedia &&
							window.matchMedia('(prefers-color-scheme: dark)').matches
						) {
							theme = 'dark';
						}
					} catch (error) {
						if (
							window.matchMedia &&
							window.matchMedia('(prefers-color-scheme: dark)').matches
						) {
							theme = 'dark';
						}
					}
				}
				root.setAttribute('data-theme', theme);
				root.setAttribute('data-bs-theme', theme);
			})();
		</script>
		<link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
