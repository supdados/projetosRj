<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Sistema de gerenciamento de projetos - Controle e acompanhe seus projetos de forma eficiente" />
		<!-- Preenchido pelo Jinja em routes/spa.py ao servir este index via render_template.
		     Em dev (vite), o placeholder permanece literal e o client.ts apenas nao injeta CSRFToken. -->
		<meta name="csrf-token" content="%CSRF_TOKEN%" />
		<!-- Valor inicial pre-hidratacao, sincronizado com --ds-color-surface-topnav (tema claro). -->
		<meta name="theme-color" content="#004973" id="appThemeColorMeta" />
		<!-- Anti-flash de tema: portado de templates/base.html:12-32.
		     Roda ANTES do primeiro paint (sincrono, no head). Seta data-theme no <html>.
		     Em producao recebe o nonce do CSP via Jinja (%CSP_NONCE%); em dev o nonce e ignorado. -->
		<script nonce="%CSP_NONCE%">
			(function () {
				var storageKey = 'projetosrj.theme';
				var root = document.documentElement;
				var theme = 'light';
				try {
					var storedTheme = window.localStorage.getItem(storageKey);
					if (storedTheme === 'light' || storedTheme === 'dark') {
						theme = storedTheme;
					} else if (
						window.matchMedia &&
						window.matchMedia('(prefers-color-scheme: dark)').matches
					) {
						theme = 'dark';
					}
				} catch (error) {
					if (
						window.matchMedia &&
						window.matchMedia('(prefers-color-scheme: dark)').matches
					) {
						theme = 'dark';
					}
				}
				root.setAttribute('data-theme', theme);
			})();
		</script>
		<link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
